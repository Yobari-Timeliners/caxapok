  - description: "caxapok icon: a sugar cube."
    path: doc/icon.png

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.19.1
  meta: ^1.18.1

dev_dependencies:
  fake_async: ^1.3.3
  test: ^1.25.6
  very_good_analysis: ^10.0.0
